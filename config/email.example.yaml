# Local Email Tracking & Outreach Configuration (IMAP & SMTP)
# Copy this file to config/email.yaml and populate with your credentials.
# Note: For Gmail, use an "App Password" (https://myaccount.google.com/apppasswords) with 2FA enabled.
# All email processing is executed 100% locally on your machine.

email:
  enabled: true
  host: "imap.gmail.com"
  smtp_host: "smtp.gmail.com"
  port: 993
  smtp_port: 587
  username: "your-email@gmail.com"
  password: "your-16-char-app-password"
  use_ssl: false
  use_tls: true
  lookback_days: 30
  auto_update_status: true
